<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gym Timer</title>
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;600;700;900&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0f14;
    --surface: #1c2030;      /* 加深，比原本 #161921 更明顯 */
    --surface2: #252a3a;     /* 加深，比原本 #1e222e 更明顯 */
    --border: rgba(255,255,255,0.09);
    --border2: rgba(255,255,255,0.18);
    --text: #e8eaf0;
    --muted: #6b7080;
    --work: #3d8bff;
    --rest: #ff6b35;
    --trans: #22c55e;        /* 換動作緩衝：綠色 */
    --accent: #a78bfa;
    --danger: #f87171;
    --success: #4ade80;
    --warn: #fbbf24;
  }

  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: background 0.8s ease;
  }

  /* ─── HEADER ─── */
  .app-header {
    width: 100%;
    max-width: 800px;
    padding: 24px 20px 0;
    display: flex;
    align-items: baseline;
    gap: 14px;
  }
  .app-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 26px; font-weight: 700;
    letter-spacing: 2px; text-transform: uppercase;
    color: var(--text);
  }
  .app-sub { font-size: 13px; color: var(--muted); letter-spacing: 0.5px; }

  /* ─── TAB BAR ─── */
  .tab-bar {
    width: 100%; max-width: 800px;
    padding: 14px 20px 0;
    display: flex; gap: 0;
  }
  .tab-btn {
    flex: 1; padding: 10px;
    background: var(--surface);
    border: 0.5px solid var(--border);
    color: var(--muted);
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 14px; cursor: pointer; transition: all 0.2s;
  }
  .tab-btn:first-child { border-radius: 10px 0 0 10px; }
  .tab-btn:last-child  { border-radius: 0 10px 10px 0; }
  .tab-btn.active { background: var(--surface2); color: var(--text); border-color: var(--border2); }

  /* ─── LAYOUT ─── */
  .layout {
    width: 100%; max-width: 800px;
    padding: 16px 20px 40px;
    display: grid; gap: 16px;
  }
  .tab-page { display: none; width: 100%; }
  .tab-page.active { display: flex; flex-direction: column; gap: 12px; }

  @media (min-width: 620px) {
    .tab-bar { display: none; }
    .layout { grid-template-columns: 280px 1fr; }
    .tab-page { display: flex !important; flex-direction: column; }
    .go-btn { display: none !important; }
  }

  /* ─── 跳轉按鈕 ─── */
  .go-btn {
    width: 100%; padding: 14px; border-radius: 12px;
    border: 0.5px solid rgba(61,139,255,0.35);
    background: rgba(61,139,255,0.08);
    color: var(--work);
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 15px; font-weight: 500;
    cursor: pointer; transition: all 0.15s; letter-spacing: 0.5px;
  }
  .go-btn:hover  { background: rgba(61,139,255,0.14); }
  .go-btn:active { transform: scale(0.98); }

  /* ─── ROUTINE PANEL ─── */
  .panel {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: 16px; overflow: hidden;
  }
  .panel-head {
    padding: 14px 18px;
    border-bottom: 0.5px solid var(--border);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px; font-weight: 600;
    letter-spacing: 2px; text-transform: uppercase;
    color: var(--muted);
    display: flex; align-items: center; justify-content: space-between;
  }
  .add-btns {
    display: flex; gap: 6px;
    padding: 12px 14px;
    border-bottom: 0.5px solid var(--border);
  }
  .add-btn {
    flex: 1; padding: 10px 6px; border-radius: 8px;
    border: 0.5px solid var(--border2);
    background: var(--surface2); color: var(--text);
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 13px; cursor: pointer; transition: all 0.15s; text-align: center;
  }
  .add-btn:hover { background: rgba(255,255,255,0.07); border-color: rgba(255,255,255,0.2); }
  .add-btn.bilateral  { border-left: 2px solid var(--work); }
  .add-btn.unilateral { border-left: 2px solid var(--accent); }
  .add-btn.warmup     { border-left: 2px solid var(--warn); }

  .routine-list {
    min-height: 160px; max-height: 320px;
    overflow-y: auto; padding: 8px;
  }
  .routine-list::-webkit-scrollbar { width: 4px; }
  .routine-list::-webkit-scrollbar-track { background: transparent; }
  .routine-list::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

  .routine-item {
    display: flex; align-items: center; gap: 8px;
    padding: 10px; border-radius: 10px; margin-bottom: 4px;
    border: 0.5px solid transparent; transition: all 0.15s;
  }
  .routine-item:hover { background: var(--surface2); border-color: var(--border); }
  .routine-item.active { background: var(--surface2); border-color: var(--border2); }
  .routine-item.done { opacity: 0.35; }

  .item-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .item-dot.bilateral  { background: var(--work); }
  .item-dot.unilateral { background: var(--accent); }
  .item-dot.warmup     { background: var(--warn); }

  .item-label { flex: 1; font-size: 13px; line-height: 1.4; }
  .item-name  { color: var(--text); font-weight: 500; }
  .item-meta  { color: var(--muted); font-size: 11px; }

  .item-del {
    width: 24px; height: 24px; border-radius: 4px;
    border: none; background: transparent;
    color: var(--muted); font-size: 15px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  @media (min-width: 620px) {
    .item-del { opacity: 0; transition: opacity 0.15s; }
    .routine-item:hover .item-del { opacity: 1; }
  }
  .item-del:hover { color: var(--danger); }

  .routine-empty {
    text-align: center; padding: 32px 16px;
    color: var(--muted); font-size: 13px; line-height: 1.7;
  }

  /* ─── TIMER PANEL ─── */
  .timer-panel {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: 16px;
    display: flex; flex-direction: column;
    overflow: hidden; position: relative;
    transition: background 0.8s ease;
  }

  .timer-info {
    padding: 14px 18px 12px;
    border-bottom: 0.5px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .current-label {
    font-size: 11px; color: var(--muted);
    letter-spacing: 1px; text-transform: uppercase;
    font-family: 'Barlow Condensed', sans-serif;
  }
  .current-name { font-size: 15px; font-weight: 500; color: var(--text); margin-top: 3px; }

  .progress-dots {
    display: flex; gap: 5px; align-items: center;
    flex-wrap: wrap; justify-content: flex-end; max-width: 120px;
  }
  .prog-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--border2); transition: background 0.3s;
  }
  .prog-dot.done   { background: var(--success); }
  .prog-dot.active { background: var(--work); }

  /* ─── CLOCK ─── */
  .clock-area {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 20px 20px 14px;
  }
  .phase-badge {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px; font-weight: 600;
    letter-spacing: 3px; text-transform: uppercase;
    color: var(--muted); margin-bottom: 8px; height: 18px;
    transition: color 0.3s;
  }
  .phase-badge.work  { color: var(--work); }
  .phase-badge.rest  { color: var(--rest); }
  .phase-badge.trans { color: var(--trans); }

  .big-time {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 88px; font-weight: 900;
    letter-spacing: -2px; line-height: 1;
    color: var(--text); transition: color 0.3s;
    min-width: 200px; text-align: center;
  }
  .big-time.work      { color: var(--work); }
  .big-time.rest      { color: var(--rest); }
  .big-time.trans     { color: var(--trans); }
  .big-time.countdown { color: var(--warn); }

  .sets-row {
    display: flex; gap: 8px; margin-top: 14px;
    align-items: center; flex-wrap: wrap;
    justify-content: center; max-width: 300px;
  }
  .set-pip {
    width: 22px; height: 6px; border-radius: 3px;
    background: var(--border2); transition: background 0.3s;
  }
  .set-pip.done        { background: var(--success); }
  .set-pip.active      { background: var(--work); }
  .set-pip.rest-active { background: var(--rest); }

  .sets-text {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px; letter-spacing: 1px;
    color: var(--muted); margin-top: 8px; text-align: center;
  }
  .side-badge {
    display: inline-block; padding: 4px 16px; border-radius: 20px;
    font-size: 13px; font-weight: 600; letter-spacing: 1.5px;
    text-transform: uppercase;
    font-family: 'Barlow Condensed', sans-serif;
    margin-top: 10px;
    background: rgba(167,139,250,0.15);
    color: var(--accent); border: 0.5px solid rgba(167,139,250,0.3);
    min-height: 26px;
  }

  /* ─── WALLCLOCK ROW（真實時鐘時間）─── */
  .wallclock-bar {
    padding: 6px 18px 0;
    display: flex; justify-content: space-between; align-items: center;
  }
  .wallclock-lbl { font-size: 11px; color: var(--muted); letter-spacing: 1px; }
  .wallclock-val {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px; color: var(--muted); letter-spacing: 1px;
  }

  /* ─── ELAPSED ─── */
  .elapsed-bar {
    padding: 4px 18px 0;
    display: flex; justify-content: space-between; align-items: center;
  }
  .elapsed-lbl { font-size: 11px; color: var(--muted); letter-spacing: 1px; }
  .elapsed-val {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px; color: var(--muted); letter-spacing: 1px;
  }

  /* ─── PROGRESS BAR ─── */
  .progress-bar-wrap { padding: 0 18px; margin-bottom: 4px; }
  .progress-bar-bg {
    height: 3px; background: var(--border2);
    border-radius: 2px; overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%; border-radius: 2px;
    background: var(--work); width: 0%;
    transition: width 1s linear, background 0.3s;
  }
  .progress-bar-fill.rest  { background: var(--rest); }
  .progress-bar-fill.trans { background: var(--trans); }

  /* ─── CONTROLS ─── */
  .controls {
    padding: 12px 14px 14px;
    display: grid; grid-template-columns: 1fr 1fr 1fr 1fr;
    gap: 7px; border-top: 0.5px solid var(--border);
  }
  .ctrl-btn {
    padding: 11px 4px; border-radius: 10px;
    border: 0.5px solid var(--border2);
    background: var(--surface2); color: var(--text);
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 12px; cursor: pointer; transition: all 0.15s;
    display: flex; flex-direction: column; align-items: center; gap: 5px;
  }
  .ctrl-btn .icon { font-size: 18px; }
  .ctrl-btn:hover  { background: rgba(255,255,255,0.07); border-color: rgba(255,255,255,0.2); }
  .ctrl-btn:active { transform: scale(0.97); }
  .ctrl-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .ctrl-btn.start  { border-color: rgba(61,139,255,0.4);  color: var(--work); }
  .ctrl-btn.start:hover  { background: rgba(61,139,255,0.12); }
  .ctrl-btn.early  { border-color: rgba(251,191,36,0.4);  color: var(--warn); }
  .ctrl-btn.early:hover  { background: rgba(251,191,36,0.12); }
  .ctrl-btn.danger { border-color: rgba(248,113,113,0.4); color: var(--danger); }
  .ctrl-btn.danger:hover { background: rgba(248,113,113,0.12); }

  /* ─── SUMMARY OVERLAY ─── */
  .summary-overlay {
    display: none; position: absolute; inset: 0;
    background: var(--surface); border-radius: 16px;
    flex-direction: column; align-items: center; justify-content: center;
    padding: 24px; z-index: 10; overflow-y: auto;
  }
  .summary-overlay.show { display: flex; }
  .summary-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 22px; font-weight: 700;
    letter-spacing: 3px; text-transform: uppercase;
    color: var(--success); margin-bottom: 18px;
  }
  .summary-grid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 10px; width: 100%; margin-bottom: 18px;
  }
  .summary-card {
    background: var(--surface2);
    border: 0.5px solid var(--border);
    border-radius: 12px; padding: 14px; text-align: center;
  }
  .summary-val {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 30px; font-weight: 700; color: var(--text);
  }
  .summary-lbl {
    font-size: 11px; color: var(--muted);
    margin-top: 4px; letter-spacing: 1px; text-transform: uppercase;
  }
  .summary-log {
    width: 100%; max-height: 120px; overflow-y: auto;
    font-size: 12px; color: var(--muted);
    line-height: 1.8; text-align: left; padding: 0 4px;
  }
  .restart-btn {
    margin-top: 18px; padding: 11px 32px; border-radius: 10px;
    border: 0.5px solid var(--border2);
    background: var(--surface2); color: var(--text);
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 14px; cursor: pointer; transition: all 0.15s;
  }
  .restart-btn:hover { background: rgba(255,255,255,0.07); }
</style>
</head>
<body>

<header class="app-header">
  <div class="app-title">Gym Timer</div>
  <div class="app-sub">自訂課表 · by C.Y.L.</div>
</header>

<div class="tab-bar">
  <button class="tab-btn active" id="tab-routine" onclick="switchTab('routine')">📋 課表安排</button>
  <button class="tab-btn" id="tab-timer" onclick="switchTab('timer')">⏱ 計時器</button>
</div>

<div class="layout">

  <!-- PAGE 1: ROUTINE BUILDER -->
  <div id="page-routine" class="tab-page active">
    <div class="panel">
      <div class="panel-head">
        <span>課表安排</span>
        <span id="routine-count" style="color:var(--muted);font-size:12px">0 個動作</span>
      </div>
      <div class="add-btns">
        <button class="add-btn warmup"     onclick="addItem('warmup')">🔥 熱身</button>
        <button class="add-btn unilateral" onclick="addItem('unilateral')">⚡ 單邊</button>
        <button class="add-btn bilateral"  onclick="addItem('bilateral')">🏋️ 雙邊</button>
      </div>
      <div class="routine-list" id="routine-list">
        <div class="routine-empty">按上方按鈕<br>加入訓練動作</div>
      </div>
    </div>
    <button class="go-btn" onclick="goToTimer()">前往計時器 →</button>
  </div>

  <!-- PAGE 2: TIMER -->
  <div id="page-timer" class="tab-page">
    <div class="timer-panel" id="timer-panel">

      <!-- SUMMARY OVERLAY -->
      <div class="summary-overlay" id="summary">
        <div class="summary-title" id="summary-title">訓練結算</div>
        <div class="summary-grid">
          <div class="summary-card">
            <div class="summary-val" id="sum-wallclock">—</div>
            <div class="summary-lbl">總訓練時長</div>
          </div>
          <div class="summary-card">
            <div class="summary-val" id="sum-active">0:00</div>
            <div class="summary-lbl">實際訓練秒</div>
          </div>
          <div class="summary-card">
            <div class="summary-val" id="sum-sets">0</div>
            <div class="summary-lbl">完成組數</div>
          </div>
          <div class="summary-card">
            <div class="summary-val" id="sum-actions">0</div>
            <div class="summary-lbl">完成動作</div>
          </div>
        </div>
        <div class="summary-log" id="summary-log"></div>
        <button class="restart-btn" onclick="resetAll()">重新開始</button>
      </div>

      <!-- CURRENT ACTION INFO -->
      <div class="timer-info">
        <div>
          <div class="current-label">目前動作</div>
          <div class="current-name" id="current-name">尚未開始</div>
        </div>
        <div class="progress-dots" id="progress-dots"></div>
      </div>

      <!-- 真實時鐘時間（開始→現在）-->
      <div class="wallclock-bar">
        <span class="wallclock-lbl">總訓練時長</span>
        <span class="wallclock-val" id="wallclock-display">—</span>
      </div>

      <!-- 訓練中累計秒數 -->
      <div class="elapsed-bar">
        <span class="elapsed-lbl">實際訓練秒</span>
        <span class="elapsed-val" id="elapsed-display">00:00</span>
      </div>

      <!-- CLOCK -->
      <div class="clock-area">
        <div class="phase-badge" id="phase-badge">準備</div>
        <div class="big-time" id="big-time">01:30</div>
        <div class="side-badge" id="side-badge" style="opacity:0">—</div>
        <div class="sets-row" id="sets-pips"></div>
        <div class="sets-text" id="sets-text">—</div>
      </div>

      <!-- PROGRESS BAR -->
      <div class="progress-bar-wrap">
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="prog-fill"></div>
        </div>
      </div>

      <!-- CONTROLS -->
      <div class="controls">
        <button class="ctrl-btn start" id="btn-start" onclick="handleStart()">
          <span class="icon">▶</span><span>開始</span>
        </button>
        <button class="ctrl-btn" id="btn-pause" onclick="handlePause()" disabled>
          <span class="icon">⏸</span><span>暫停</span>
        </button>
        <button class="ctrl-btn early" id="btn-early" onclick="handleEarly()" disabled>
          <span class="icon">⏭</span><span>提早完成</span>
        </button>
        <button class="ctrl-btn danger" id="btn-stop" onclick="handleStop()" disabled>
          <span class="icon">■</span><span>停止結算</span>
        </button>
      </div>

    </div>
  </div>

</div>

<script>
// ─── TAB ────────────────────────────────────────────────
function switchTab(name) {
  document.querySelectorAll('.tab-page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  document.getElementById('tab-' + name).classList.add('active');
}
function goToTimer() {
  if (!routine.length) { alert('請先加入至少一個訓練動作'); return; }
  switchTab('timer');
}

// ─── DATA ───────────────────────────────────────────────
// work 改為 90s；單邊 8 組（左右交替）；動作間緩衝 120s
const TRANSITION_SEC = 120;

const MODES = {
  warmup:     { label:'熱身組',   work:60,  rest:15, sets:2, fixedSets:true  },
  unilateral: { label:'單邊訓練', work:90,  rest:30, sets:8, fixedSets:false },
  bilateral:  { label:'雙邊訓練', work:90,  rest:45, sets:4, fixedSets:false }
};

let routine       = [];
let actionIdx     = 0;
let setIdx        = 0;
// phase: 'IDLE' | 'WORK' | 'REST' | 'TRANSITION' | 'PAUSED'
let phase         = 'IDLE';
let remaining     = 0;
let phaseTotal    = 0;
let timerId       = null;
let totalActive   = 0;   // 只累計 WORK 秒數
let completedSets    = 0;
let completedActions = 0;
let currentSide   = 'L';
let sessionLog    = [];
let isRunning     = false;
let isPaused      = false;

// 真實時鐘：用 Date.now() 記錄，暫停不影響
let wallclockStart  = null;   // 按下開始的 timestamp
let wallclockEnd    = null;   // 訓練結束的 timestamp
let wallclockTimer  = null;   // 每秒更新顯示用

// ─── AUDIO ──────────────────────────────────────────────
let audioCtx = null;
function getAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function playTone(freq, dur, type='sine', vol=0.12) {
  const ctx = getAudio();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, ctx.currentTime);
  gain.gain.setValueAtTime(vol, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur/1000);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(); osc.stop(ctx.currentTime + dur/1000);
}
function playBeep()   { playTone(660, 120); }
function playTimeUp() {
  playTone(880, 400, 'sine', 0.15);
  setTimeout(() => playTone(880, 400, 'sine', 0.12), 420);
}
function playFinish() {
  [523, 659, 784].forEach((f, i) => setTimeout(() => playTone(f, 300, 'sine', 0.13), i * 180));
}

// ─── ROUTINE BUILDER ────────────────────────────────────
let itemCounter = 0;
function addItem(type) {
  const m = MODES[type];
  routine.push({ id:++itemCounter, type, label:m.label, work:m.work, rest:m.rest, sets:m.sets });
  renderList();
}
function removeItem(id) {
  routine = routine.filter(r => r.id !== id);
  renderList();
}
function renderList() {
  const el = document.getElementById('routine-list');
  document.getElementById('routine-count').textContent = routine.length + ' 個動作';
  if (!routine.length) {
    el.innerHTML = '<div class="routine-empty">按上方按鈕<br>加入訓練動作</div>';
    return;
  }
  el.innerHTML = routine.map((item, i) => `
    <div class="routine-item ${i===actionIdx&&isRunning?'active':''} ${i<actionIdx&&isRunning?'done':''}">
      <div class="item-dot ${item.type}"></div>
      <div class="item-label">
        <div class="item-name">${item.label}</div>
        <div class="item-meta">${fmtSec(item.work)} · 休${fmtSec(item.rest)} · ${item.sets}組</div>
      </div>
      <button class="item-del" onclick="removeItem(${item.id})">✕</button>
    </div>
  `).join('');
  renderProgressDots();
}
function renderProgressDots() {
  const el = document.getElementById('progress-dots');
  if (!routine.length) { el.innerHTML = ''; return; }
  const max = Math.min(routine.length, 10);
  el.innerHTML = Array.from({length:max}, (_,i) => {
    const cls = i < actionIdx ? 'done' : (i===actionIdx&&isRunning ? 'active' : '');
    return `<div class="prog-dot ${cls}"></div>`;
  }).join('');
}

// ─── TIMER CORE ─────────────────────────────────────────
function getCurrentAction() { return routine[actionIdx]; }

// 統一啟動任一 phase
function startPhase(p) {
  const action = getCurrentAction();
  phase = p;
  if (p === 'WORK')       { phaseTotal = action.work; }
  else if (p === 'REST')  { phaseTotal = action.rest; }
  else if (p === 'TRANSITION') { phaseTotal = TRANSITION_SEC; }
  remaining = phaseTotal;
  updateUI();
  clearInterval(timerId);
  timerId = setInterval(tick, 1000);
}

function tick() {
  remaining--;
  // 只有 WORK 階段累計實際訓練秒
  if (phase === 'WORK') totalActive++;
  updateUI();

  // 最後 3 秒的提示音（REST 和 TRANSITION 都給）
  if ((phase === 'REST' || phase === 'TRANSITION') && remaining <= 3 && remaining > 0) {
    playBeep();
  }

  if (remaining <= 0) {
    clearInterval(timerId);
    timerId = null;
    onPhaseEnd();
  }
}

function onPhaseEnd() {
  const action = getCurrentAction();

  // ── WORK 結束 → 進入 REST ──
  if (phase === 'WORK') {
    playTimeUp();
    startPhase('REST');
    return;
  }

  // ── REST 結束 → 判斷是否還有下一組 ──
  if (phase === 'REST') {
    completedSets++;
    setIdx++;

    if (setIdx < action.sets) {
      // 同一動作還有下一組：直接開始訓練
      if (action.type === 'unilateral') currentSide = currentSide === 'L' ? 'R' : 'L';
      playTimeUp();
      startPhase('WORK');
      return;
    }

    // 此動作全部組數完成
    completedActions++;
    sessionLog.push(`✓ ${action.label} — ${action.sets}組完成`);
    actionIdx++;
    setIdx = 0;
    currentSide = 'L';
    renderList();

    if (actionIdx < routine.length) {
      // 還有下一個動作 → 進入換動作緩衝
      playTimeUp();
      startPhase('TRANSITION');
    } else {
      // 全部課表完成
      finishAll();
    }
    return;
  }

  // ── TRANSITION 結束 → 開始下一個動作 ──
  if (phase === 'TRANSITION') {
    playTimeUp();
    startPhase('WORK');
    return;
  }
}

function finishAll() {
  playFinish();
  phase = 'IDLE';
  isRunning = false;
  wallclockEnd = Date.now();
  clearInterval(wallclockTimer);
  updateWallclock();
  showSummary(true);
}

// ─── 真實時鐘更新 ───────────────────────────────────────
function updateWallclock() {
  const el = document.getElementById('wallclock-display');
  if (!wallclockStart) { el.textContent = '—'; return; }
  const end = wallclockEnd || Date.now();
  const diff = Math.floor((end - wallclockStart) / 1000);
  el.textContent = fmtTime(diff);
}

// ─── CONTROLS ───────────────────────────────────────────
function handleStart() {
  if (!routine.length) { alert('請先在課表安排頁加入訓練動作'); return; }
  getAudio();

  if (isPaused) {
    isPaused = false; isRunning = true;
    timerId = setInterval(tick, 1000);
    // 壁鐘繼續跑（時間已經包含暫停中的等待，這是預期行為）
    if (!wallclockTimer) {
      wallclockTimer = setInterval(updateWallclock, 1000);
    }
    updateBtns();
    return;
  }

  if (!isRunning) {
    isRunning = true;
    actionIdx = 0; setIdx = 0; currentSide = 'L';
    completedSets = 0; completedActions = 0;
    totalActive = 0;
    sessionLog = [];
    // 記錄真實開始時間
    wallclockStart = Date.now();
    wallclockEnd   = null;
    wallclockTimer = setInterval(updateWallclock, 1000);
    startPhase('WORK');
    updateBtns();
    renderList();
  }
}

function handlePause() {
  if (!isRunning) return;
  isPaused = true; isRunning = false;
  clearInterval(timerId); timerId = null;
  // 壁鐘計時器停止（暫停期間不計入壁鐘）
  // 注意：這裡選擇「暫停時壁鐘也停」，若想讓壁鐘包含暫停時間，把下面這行刪掉即可
  clearInterval(wallclockTimer); wallclockTimer = null;
  phase = 'PAUSED';
  updateUI(); updateBtns();
}

function handleEarly() {
  if (!isRunning) return;
  clearInterval(timerId); timerId = null;
  remaining = 0;
  onPhaseEnd();
}

function handleStop() {
  clearInterval(timerId); timerId = null;
  clearInterval(wallclockTimer); wallclockTimer = null;
  isRunning = false; isPaused = false;
  phase = 'IDLE';
  wallclockEnd = Date.now();
  updateWallclock();
  showSummary(false);
}

function resetAll() {
  clearInterval(timerId); timerId = null;
  clearInterval(wallclockTimer); wallclockTimer = null;
  isRunning = false; isPaused = false; phase = 'IDLE';
  actionIdx = 0; setIdx = 0; remaining = 0; phaseTotal = 0;
  totalActive = 0;
  completedSets = 0; completedActions = 0;
  sessionLog = []; currentSide = 'L';
  wallclockStart = null; wallclockEnd = null;
  document.getElementById('summary').classList.remove('show');
  updateUI(); updateBtns(); updateWallclock(); renderList();
  document.getElementById('elapsed-display').textContent = '00:00';
}

// ─── UI ─────────────────────────────────────────────────
function updateUI() {
  const bt        = document.getElementById('big-time');
  const pb        = document.getElementById('phase-badge');
  const fill      = document.getElementById('prog-fill');
  const sideBadge = document.getElementById('side-badge');
  const setsText  = document.getElementById('sets-text');
  const curName   = document.getElementById('current-name');
  const pips      = document.getElementById('sets-pips');
  const timerPanel= document.getElementById('timer-panel');
  const action    = getCurrentAction();

  // 實際訓練秒數更新
  document.getElementById('elapsed-display').textContent = fmtTime(totalActive);

  bt.textContent = fmtTime(remaining);
  bt.className   = 'big-time';
  pb.className   = 'phase-badge';
  fill.className = 'progress-bar-fill';

  if (phase === 'WORK') {
    timerPanel.style.background = '#071c3a';
    bt.classList.add(remaining <= 3 && remaining > 0 ? 'countdown' : 'work');
    pb.textContent = '訓練中'; pb.classList.add('work');

  } else if (phase === 'REST') {
    timerPanel.style.background = '#1f1200';
    bt.classList.add(remaining <= 3 && remaining > 0 ? 'countdown' : 'rest');
    pb.textContent = '休息中'; pb.classList.add('rest');
    fill.classList.add('rest');

  } else if (phase === 'TRANSITION') {
    timerPanel.style.background = '#0a1f12';
    bt.classList.add(remaining <= 3 && remaining > 0 ? 'countdown' : 'trans');
    pb.textContent = '換動作'; pb.classList.add('trans');
    fill.classList.add('trans');

  } else if (phase === 'PAUSED') {
    timerPanel.style.background = '#16161e';
    pb.textContent = '暫停中';

  } else {
    // IDLE
    timerPanel.style.background = '#1c2030';
    pb.textContent = '準備';
    bt.textContent = action ? fmtTime(action.work) : '01:30';
  }

  const pct = phaseTotal > 0 ? Math.round((1 - remaining / phaseTotal) * 100) : 0;
  fill.style.width = pct + '%';

  // 動作名稱（TRANSITION 時顯示下一個動作）
  if (phase === 'TRANSITION') {
    const nextAction = routine[actionIdx]; // actionIdx 已更新到下一個
    curName.textContent = nextAction ? '準備：' + nextAction.label : '換動作中';
  } else {
    curName.textContent = action ? action.label : (isRunning ? '全部完成！' : '尚未開始');
  }

  // 側邊標示（單邊）
  if (action && action.type === 'unilateral' && isRunning && phase === 'WORK') {
    sideBadge.style.opacity = '1';
    sideBadge.textContent = currentSide === 'L' ? '左側' : '右側';
  } else {
    sideBadge.style.opacity = '0';
  }

  // 組數進度 pips（TRANSITION 時顯示下一動作的組數預覽）
  const pipAction = (phase === 'TRANSITION') ? routine[actionIdx] : action;
  if (pipAction && phase !== 'TRANSITION') {
    pips.innerHTML = Array.from({length: pipAction.sets}, (_, i) => {
      const cls = i < setIdx ? 'done'
        : (i === setIdx ? (phase === 'REST' ? 'rest-active' : 'active') : '');
      return `<div class="set-pip ${cls}"></div>`;
    }).join('');
    setsText.textContent = `第 ${setIdx + 1} / ${pipAction.sets} 組`;
  } else if (phase === 'TRANSITION' && pipAction) {
    pips.innerHTML = Array.from({length: pipAction.sets}, () =>
      `<div class="set-pip"></div>`).join('');
    setsText.textContent = `共 ${pipAction.sets} 組`;
  } else {
    pips.innerHTML = ''; setsText.textContent = '—';
  }

  renderProgressDots();
}

function updateBtns() {
  const a = isRunning, p = isPaused;
  document.getElementById('btn-start').disabled = a && !p;
  document.getElementById('btn-pause').disabled = !a;
  document.getElementById('btn-early').disabled = !a;
  document.getElementById('btn-stop').disabled  = !a && !p;
  document.getElementById('btn-start').children[1].textContent = p ? '繼續' : '開始';
  document.getElementById('btn-start').children[0].textContent = '▶';
}

function showSummary(complete) {
  document.getElementById('summary-title').textContent = complete ? '🎉 訓練完成！' : '訓練結算';
  // 壁鐘總時長
  if (wallclockStart) {
    const end  = wallclockEnd || Date.now();
    const diff = Math.floor((end - wallclockStart) / 1000);
    document.getElementById('sum-wallclock').textContent = fmtTime(diff);
  } else {
    document.getElementById('sum-wallclock').textContent = '—';
  }
  document.getElementById('sum-active').textContent  = fmtTime(totalActive);
  document.getElementById('sum-sets').textContent    = completedSets;
  document.getElementById('sum-actions').textContent = completedActions;
  const log = document.getElementById('summary-log');
  log.innerHTML = sessionLog.length
    ? sessionLog.map(l => `<div>${l}</div>`).join('')
    : '<div>尚無完成紀錄</div>';
  document.getElementById('summary').classList.add('show');
}

// ─── HELPERS ────────────────────────────────────────────
function fmtTime(s) {
  const m = Math.floor(Math.abs(s) / 60), sec = Math.abs(s) % 60;
  return (m < 10 ? '0' + m : m) + ':' + (sec < 10 ? '0' + sec : sec);
}
function fmtSec(s) {
  return s >= 60 ? Math.floor(s/60) + '分' + (s % 60 ? s % 60 + '秒' : '') : s + '秒';
}

// ─── INIT ───────────────────────────────────────────────
updateUI();
updateBtns();

// ─── SCREEN WAKE LOCK (防手機休眠邏輯) ───────────────────
let wakeLock = null;

// 申請「鎖定螢幕」，不讓手機睡覺
async function requestWakeLock() {
  // 檢查使用者的手機瀏覽器有沒有支援這個功能
  if ('wakeLock' in navigator) {
    try {
      wakeLock = await navigator.wakeLock.request('screen');
      console.log('💪 螢幕防休眠已啟動！');
    } catch (err) {
      console.log('防休眠啟動失敗:', err.message);
    }
  }
}

// 釋放鎖定，讓手機恢復可以正常省電睡眠
function releaseWakeLock() {
  if (wakeLock !== null) {
    wakeLock.release();
    wakeLock = null;
    console.log('💤 螢幕已恢復正常休眠機制');
  }
}

// 🎯 智慧連動：只有在「計時器正在跑 (isRunning)」的時候才鎖定螢幕
// 我們去修改原本的操控按鈕功能，讓它們自動觸發防休眠
const originalHandleStart = handleStart;
handleStart = function() {
  originalHandleStart(); // 先執行原本的開始邏輯
  if (isRunning) {
    requestWakeLock();   // 只要計時器開始跑，就向手機申請「不准睡」
  }
};

const originalHandleStop = handleStop;
handleStop = function() {
  originalHandleStop();  // 先執行原本的結算邏輯
  releaseWakeLock();     // 訓練結束了，釋放螢幕，讓手機可以正常省電
};

const originalResetAll = resetAll;
resetAll = function() {
  originalResetAll();
  releaseWakeLock();     // 重設課表時也釋放螢幕
};

// 防呆機制：如果使用者中途切換到別的 App (例如去回 LINE) 再切回來
// 瀏覽器會自動中斷鎖定，所以切回來時如果計時器還在跑，要自動重新申請鎖定
document.addEventListener('visibilitychange', async () => {
  if (wakeLock !== null && document.visibilityState === 'visible' && isRunning) {
    await requestWakeLock();
  }
});
 
</script>

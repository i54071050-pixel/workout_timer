<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>重訓計時器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;600;700;900&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0f14;
    --surface: #161921;
    --surface2: #1e222e;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.14);
    --text: #e8eaf0;
    --muted: #6b7080;
    --work: #3d8bff;
    --work-glow: rgba(61,139,255,0.25);
    --rest: #ff6b35;
    --rest-glow: rgba(255,107,53,0.25);
    --accent: #a78bfa;
    --danger: #f87171;
    --success: #4ade80;
    --warn: #fbbf24;
  }

  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .app-header {
    width: 100%;
    max-width: 800px;
    padding: 28px 24px 0;
    display: flex;
    align-items: baseline;
    gap: 14px;
  }

  .app-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text);
  }

  .app-sub {
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 0.5px;
  }

  .layout {
    width: 100%;
    max-width: 800px;
    padding: 20px 24px 40px;
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 20px;
  }

  /* ─── LEFT PANEL: ROUTINE BUILDER ─── */
  .panel {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
  }

  .panel-head {
    padding: 14px 18px;
    border-bottom: 0.5px solid var(--border);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .add-btns {
    display: flex;
    gap: 6px;
    padding: 12px 14px;
    border-bottom: 0.5px solid var(--border);
  }

  .add-btn {
    flex: 1;
    padding: 8px 6px;
    border-radius: 8px;
    border: 0.5px solid var(--border2);
    background: var(--surface2);
    color: var(--text);
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
  }

  .add-btn:hover { background: rgba(255,255,255,0.07); border-color: rgba(255,255,255,0.2); }

  .add-btn.bilateral { border-left: 2px solid var(--work); }
  .add-btn.unilateral { border-left: 2px solid var(--accent); }
  .add-btn.warmup { border-left: 2px solid var(--warn); }

  .routine-list {
    min-height: 200px;
    max-height: 360px;
    overflow-y: auto;
    padding: 8px;
  }

  .routine-list::-webkit-scrollbar { width: 4px; }
  .routine-list::-webkit-scrollbar-track { background: transparent; }
  .routine-list::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

  .routine-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 10px;
    border-radius: 10px;
    margin-bottom: 4px;
    border: 0.5px solid transparent;
    cursor: pointer;
    transition: all 0.15s;
    position: relative;
  }

  .routine-item:hover { background: var(--surface2); border-color: var(--border); }
  .routine-item.active { background: var(--surface2); border-color: var(--border2); }
  .routine-item.done { opacity: 0.35; }

  .item-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .item-dot.bilateral { background: var(--work); }
  .item-dot.unilateral { background: var(--accent); }
  .item-dot.warmup { background: var(--warn); }

  .item-label {
    flex: 1;
    font-size: 12px;
    line-height: 1.4;
  }

  .item-name {
    color: var(--text);
    font-weight: 500;
  }

  .item-meta {
    color: var(--muted);
    font-size: 11px;
  }

  .item-del {
    width: 20px; height: 20px;
    border-radius: 4px;
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 14px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    opacity: 0;
    transition: opacity 0.15s;
  }

  .routine-item:hover .item-del { opacity: 1; }
  .item-del:hover { color: var(--danger); }

  .routine-empty {
    text-align: center;
    padding: 32px 16px;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.7;
  }

  /* ─── RIGHT PANEL: TIMER ─── */
  .timer-panel {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .timer-info {
    padding: 16px 20px 12px;
    border-bottom: 0.5px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .current-label {
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 1px;
    text-transform: uppercase;
    font-family: 'Barlow Condensed', sans-serif;
  }

  .current-name {
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
    margin-top: 3px;
  }

  .progress-dots {
    display: flex;
    gap: 5px;
    align-items: center;
  }

  .prog-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--border2);
    transition: background 0.3s;
  }

  .prog-dot.done { background: var(--success); }
  .prog-dot.active { background: var(--work); }

  /* ─── CLOCK FACE ─── */
  .clock-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 20px 16px;
    position: relative;
  }

  .phase-badge {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
    height: 18px;
    transition: color 0.3s;
  }

  .phase-badge.work { color: var(--work); }
  .phase-badge.rest { color: var(--rest); }

  .big-time {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 96px;
    font-weight: 900;
    letter-spacing: -2px;
    line-height: 1;
    color: var(--text);
    transition: color 0.3s;
    min-width: 200px;
    text-align: center;
  }

  .big-time.work { color: var(--work); }
  .big-time.rest { color: var(--rest); }
  .big-time.countdown { color: var(--warn); }

  .sets-row {
    display: flex;
    gap: 12px;
    margin-top: 16px;
    align-items: center;
  }

  .set-pip {
    width: 28px; height: 6px;
    border-radius: 3px;
    background: var(--border2);
    transition: background 0.3s;
  }

  .set-pip.done { background: var(--success); }
  .set-pip.active { background: var(--work); }
  .set-pip.rest-active { background: var(--rest); }

  .sets-text {
    font-size: 13px;
    color: var(--muted);
    margin-top: 8px;
    text-align: center;
    font-family: 'Barlow Condensed', sans-serif;
    letter-spacing: 1px;
    font-size: 14px;
  }

  .side-badge {
    display: inline-block;
    padding: 4px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    font-family: 'Barlow Condensed', sans-serif;
    margin-top: 10px;
    background: rgba(167,139,250,0.15);
    color: var(--accent);
    border: 0.5px solid rgba(167,139,250,0.3);
    min-height: 26px;
  }

  /* ─── PROGRESS BAR ─── */
  .progress-bar-wrap {
    padding: 0 20px;
    margin-bottom: 4px;
  }

  .progress-bar-bg {
    height: 3px;
    background: var(--border2);
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    border-radius: 2px;
    background: var(--work);
    width: 0%;
    transition: width 1s linear, background 0.3s;
  }

  .progress-bar-fill.rest { background: var(--rest); }

  /* ─── CONTROLS ─── */
  .controls {
    padding: 14px 16px 16px;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr;
    gap: 8px;
    border-top: 0.5px solid var(--border);
  }

  .ctrl-btn {
    padding: 10px 4px;
    border-radius: 10px;
    border: 0.5px solid var(--border2);
    background: var(--surface2);
    color: var(--text);
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
  }

  .ctrl-btn .icon { font-size: 18px; }
  .ctrl-btn:hover { background: rgba(255,255,255,0.07); border-color: rgba(255,255,255,0.2); }
  .ctrl-btn:active { transform: scale(0.97); }
  .ctrl-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  .ctrl-btn.start { border-color: rgba(61,139,255,0.4); color: var(--work); }
  .ctrl-btn.start:hover { background: rgba(61,139,255,0.12); }
  .ctrl-btn.early { border-color: rgba(251,191,36,0.4); color: var(--warn); }
  .ctrl-btn.early:hover { background: rgba(251,191,36,0.12); }
  .ctrl-btn.danger { border-color: rgba(248,113,113,0.4); color: var(--danger); }
  .ctrl-btn.danger:hover { background: rgba(248,113,113,0.12); }

  /* ─── SUMMARY ─── */
  .summary-overlay {
    display: none;
    position: absolute;
    inset: 0;
    background: var(--surface);
    border-radius: 16px;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 28px;
    z-index: 10;
  }

  .summary-overlay.show { display: flex; }

  .summary-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--success);
    margin-bottom: 20px;
  }

  .summary-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    width: 100%;
    margin-bottom: 20px;
  }

  .summary-card {
    background: var(--surface2);
    border: 0.5px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    text-align: center;
  }

  .summary-val {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 32px;
    font-weight: 700;
    color: var(--text);
  }

  .summary-lbl {
    font-size: 11px;
    color: var(--muted);
    margin-top: 4px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .summary-log {
    width: 100%;
    max-height: 160px;
    overflow-y: auto;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.8;
    text-align: left;
    padding: 0 4px;
  }

  .restart-btn {
    margin-top: 20px;
    padding: 11px 32px;
    border-radius: 10px;
    border: 0.5px solid var(--border2);
    background: var(--surface2);
    color: var(--text);
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.15s;
  }

  .restart-btn:hover { background: rgba(255,255,255,0.07); }

  .timer-panel { position: relative; }

  /* ─── TOTAL ELAPSED ─── */
  .elapsed-bar {
    padding: 8px 20px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .elapsed-lbl { font-size: 11px; color: var(--muted); letter-spacing: 1px; }
  .elapsed-val { font-family: 'Barlow Condensed', sans-serif; font-size: 14px; color: var(--muted); letter-spacing: 1px; }
</style>
</head>
<body>

<header class="app-header">
  <div class="app-title">重訓計時器</div>
  <div class="app-sub">自訂課表 · 雙邊 / 單邊交替</div>
</header>

<div class="layout">

  <!-- LEFT: ROUTINE BUILDER -->
  <div class="panel">
    <div class="panel-head">
      <span>課表安排</span>
      <span id="routine-count" style="color:var(--muted);font-size:12px">0 個動作</span>
    </div>
    <div class="add-btns">
      <button class="add-btn warmup" onclick="addItem('warmup')">🔥 熱身</button>
      <button class="add-btn unilateral" onclick="addItem('unilateral')">⚡ 單邊</button>
      <button class="add-btn bilateral" onclick="addItem('bilateral')">🏋️ 雙邊</button>
    </div>
    <div class="routine-list" id="routine-list">
      <div class="routine-empty">按上方按鈕<br>加入訓練動作</div>
    </div>
  </div>

  <!-- RIGHT: TIMER -->
  <div class="timer-panel" id="timer-panel">

    <!-- SUMMARY OVERLAY -->
    <div class="summary-overlay" id="summary">
      <div class="summary-title" id="summary-title">訓練結算</div>
      <div class="summary-grid">
        <div class="summary-card">
          <div class="summary-val" id="sum-active">0:00</div>
          <div class="summary-lbl">實際訓練</div>
        </div>
        <div class="summary-card">
          <div class="summary-val" id="sum-rest">0:00</div>
          <div class="summary-lbl">總休息</div>
        </div>
        <div class="summary-card">
          <div class="summary-val" id="sum-sets">0</div>
          <div class="summary-lbl">完成組數</div>
        </div>
        <div class="summary-card">
          <div class="summary-val" id="sum-actions">0</div>
          <div class="summary-lbl">完成動作</div>
        </div>
      </div>
      <div class="summary-log" id="summary-log"></div>
      <button class="restart-btn" onclick="resetAll()">重新開始</button>
    </div>

    <!-- CURRENT ACTION INFO -->
    <div class="timer-info">
      <div>
        <div class="current-label">目前動作</div>
        <div class="current-name" id="current-name">尚未開始</div>
      </div>
      <div class="progress-dots" id="progress-dots"></div>
    </div>

    <!-- ELAPSED BAR -->
    <div class="elapsed-bar">
      <span class="elapsed-lbl">本次累計</span>
      <span class="elapsed-val" id="elapsed-display">00:00</span>
    </div>

    <!-- CLOCK -->
    <div class="clock-area">
      <div class="phase-badge" id="phase-badge">準備</div>
      <div class="big-time" id="big-time">01:00</div>
      <div class="side-badge" id="side-badge" style="opacity:0">—</div>
      <div class="sets-row" id="sets-pips"></div>
      <div class="sets-text" id="sets-text">—</div>
    </div>

    <!-- PROGRESS BAR -->
    <div class="progress-bar-wrap">
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="prog-fill"></div>
      </div>
    </div>

    <!-- CONTROLS -->
    <div class="controls">
      <button class="ctrl-btn start" id="btn-start" onclick="handleStart()">
        <span class="icon">▶</span><span>開始</span>
      </button>
      <button class="ctrl-btn" id="btn-pause" onclick="handlePause()" disabled>
        <span class="icon">⏸</span><span>暫停</span>
      </button>
      <button class="ctrl-btn early" id="btn-early" onclick="handleEarly()" disabled>
        <span class="icon">⏭</span><span>提早完成</span>
      </button>
      <button class="ctrl-btn danger" id="btn-stop" onclick="handleStop()" disabled>
        <span class="icon">■</span><span>停止結算</span>
      </button>
    </div>

  </div>
</div>

<script>
// ─── DATA ───────────────────────────────────────────────
const MODES = {
  warmup:    { label:'熱身組', work:60, rest:15, sets:2,  fixedSets:true },
  unilateral:{ label:'單邊訓練', work:60, rest:30, sets:4, fixedSets:false },
  bilateral: { label:'雙邊訓練', work:60, rest:45, sets:4, fixedSets:false }
};

let routine = [];
let actionIdx = 0;
let setIdx = 0;
let phase = 'IDLE'; // IDLE, WORK, REST, PAUSED
let remaining = 0;
let phaseTotal = 0;
let timerId = null;
let elapsedTimer = null;
let totalElapsed = 0;
let totalActive = 0;
let totalRest = 0;
let completedSets = 0;
let completedActions = 0;
let currentSide = 'L';
let sessionLog = [];
let isRunning = false;
let isPaused = false;

// ─── AUDIO ──────────────────────────────────────────────
let audioCtx = null;

function getAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function playTone(freq, dur, type='sine', vol=0.12) {
  const ctx = getAudio();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, ctx.currentTime);
  gain.gain.setValueAtTime(vol, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur/1000);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(); osc.stop(ctx.currentTime + dur/1000);
}

function playBeep()     { playTone(660, 120); }
function playTimeUp()   { playTone(880, 400, 'sine', 0.15); setTimeout(()=>playTone(880,400,'sine',0.12),420); }
function playFinish()   { [523,659,784].forEach((f,i)=>setTimeout(()=>playTone(f,300,'sine',0.13),i*180)); }

// ─── ROUTINE BUILDER ────────────────────────────────────
let itemCounter = 0;

function addItem(type) {
  const m = MODES[type];
  const item = {
    id: ++itemCounter,
    type,
    label: m.label,
    work: m.work,
    rest: m.rest,
    sets: m.sets,
    fixedSets: m.fixedSets
  };
  routine.push(item);
  renderList();
}

function removeItem(id) {
  routine = routine.filter(r => r.id !== id);
  renderList();
}

function renderList() {
  const el = document.getElementById('routine-list');
  document.getElementById('routine-count').textContent = routine.length + ' 個動作';
  if (!routine.length) {
    el.innerHTML = '<div class="routine-empty">按上方按鈕<br>加入訓練動作</div>';
    return;
  }
  el.innerHTML = routine.map((item, i) => `
    <div class="routine-item ${i === actionIdx && isRunning ? 'active':''} ${i < actionIdx && isRunning ? 'done':''}" id="ri-${item.id}">
      <div class="item-dot ${item.type}"></div>
      <div class="item-label">
        <div class="item-name">${item.label}</div>
        <div class="item-meta">${fmtSec(item.work)}組 · 休${fmtSec(item.rest)} · ${item.sets}組</div>
      </div>
      <button class="item-del" onclick="removeItem(${item.id})" title="刪除">✕</button>
    </div>
  `).join('');
  renderProgressDots();
}

function renderProgressDots() {
  const el = document.getElementById('progress-dots');
  if (!routine.length) { el.innerHTML = ''; return; }
  const max = Math.min(routine.length, 8);
  el.innerHTML = Array.from({length: max}, (_,i) => {
    let cls = '';
    if (i < actionIdx) cls = 'done';
    else if (i === actionIdx && isRunning) cls = 'active';
    return `<div class="prog-dot ${cls}"></div>`;
  }).join('');
}

// ─── TIMER LOGIC ────────────────────────────────────────
function getCurrentAction() { return routine[actionIdx]; }

function startPhase(p) {
  const action = getCurrentAction();
  if (!action) return;
  phase = p;
  phaseTotal = p === 'WORK' ? action.work : action.rest;
  remaining = phaseTotal;
  updateUI();
  clearInterval(timerId);
  timerId = setInterval(tick, 1000);
}

function tick() {
  remaining--;
  if (phase === 'WORK') totalActive++;
  else totalRest++;
  updateUI();

  if (phase === 'REST' && remaining <= 3 && remaining > 0) playBeep();

  if (remaining <= 0) {
    clearInterval(timerId);
    timerId = null;
    onPhaseEnd();
  }
}

function onPhaseEnd() {
  const action = getCurrentAction();
  if (phase === 'WORK') {
    playTimeUp();
    // move to REST
    phase = 'REST';
    phaseTotal = action.rest;
    remaining = action.rest;
    updateUI();
    timerId = setInterval(tick, 1000);
  } else {
    // REST ended → next set or next action
    completedSets++;
    setIdx++;
    const action = getCurrentAction();
    if (setIdx < action.sets) {
      // next set — if unilateral, flip side
      if (action.type === 'unilateral') currentSide = currentSide === 'L' ? 'R' : 'L';
      startPhase('WORK');
      playTimeUp();
    } else {
      // action done
      completedActions++;
      sessionLog.push(`✓ ${action.label} — ${action.sets}組完成`);
      actionIdx++;
      setIdx = 0;
      currentSide = 'L';
      renderList();
      if (actionIdx < routine.length) {
        playTimeUp();
        startPhase('WORK');
      } else {
        // ALL DONE
        playFinish();
        phase = 'IDLE';
        isRunning = false;
        clearInterval(elapsedTimer);
        showSummary(true);
      }
    }
  }
}

// ─── CONTROLS ───────────────────────────────────────────
function handleStart() {
  if (!routine.length) { alert('請先加入至少一個訓練動作'); return; }
  getAudio(); // unlock audio context on user gesture

  if (isPaused) {
    isPaused = false;
    isRunning = true;
    timerId = setInterval(tick, 1000);
    elapsedTimer = setInterval(()=>{ totalElapsed++; updateElapsed(); }, 1000);
    updateBtns();
    return;
  }

  if (!isRunning) {
    isRunning = true;
    actionIdx = 0;
    setIdx = 0;
    currentSide = 'L';
    completedSets = 0;
    completedActions = 0;
    totalActive = 0; totalRest = 0; totalElapsed = 0;
    sessionLog = [];
    elapsedTimer = setInterval(()=>{ totalElapsed++; updateElapsed(); }, 1000);
    startPhase('WORK');
    updateBtns();
    renderList();
  }
}

function handlePause() {
  if (!isRunning) return;
  isPaused = true;
  isRunning = false;
  clearInterval(timerId); timerId = null;
  clearInterval(elapsedTimer); elapsedTimer = null;
  phase = 'PAUSED';
  updateUI();
  updateBtns();
}

function handleEarly() {
  if (!isRunning) return;
  clearInterval(timerId); timerId = null;
  remaining = 0;
  onPhaseEnd();
}

function handleStop() {
  clearInterval(timerId); timerId = null;
  clearInterval(elapsedTimer); elapsedTimer = null;
  isRunning = false; isPaused = false;
  phase = 'IDLE';
  showSummary(false);
}

function resetAll() {
  clearInterval(timerId); timerId = null;
  clearInterval(elapsedTimer); elapsedTimer = null;
  isRunning = false; isPaused = false;
  phase = 'IDLE';
  actionIdx = 0; setIdx = 0; remaining = 0; phaseTotal = 0;
  totalElapsed = 0; totalActive = 0; totalRest = 0;
  completedSets = 0; completedActions = 0;
  sessionLog = [];
  currentSide = 'L';
  document.getElementById('summary').classList.remove('show');
  updateUI(); updateBtns(); updateElapsed(); renderList();
}

// ─── UI UPDATERS ────────────────────────────────────────
function updateUI() {
  const bt = document.getElementById('big-time');
  const pb = document.getElementById('phase-badge');
  const fill = document.getElementById('prog-fill');
  const sideBadge = document.getElementById('side-badge');
  const setsText = document.getElementById('sets-text');
  const curName = document.getElementById('current-name');
  const pips = document.getElementById('sets-pips');

  const action = getCurrentAction();

  // time display
  bt.textContent = fmtTime(remaining);

  // phase colours
  bt.className = 'big-time';
  pb.className = 'phase-badge';

  if (phase === 'WORK') {
    if (remaining <= 3 && remaining > 0) bt.classList.add('countdown');
    else bt.classList.add('work');
    pb.textContent = '訓練中';
    pb.classList.add('work');
    fill.className = 'progress-bar-fill';
  } else if (phase === 'REST') {
    if (remaining <= 3 && remaining > 0) bt.classList.add('countdown');
    else bt.classList.add('rest');
    pb.textContent = '休息';
    pb.classList.add('rest');
    fill.className = 'progress-bar-fill rest';
  } else if (phase === 'PAUSED') {
    pb.textContent = '暫停中';
  } else {
    pb.textContent = '準備';
    bt.textContent = action ? fmtTime(action.work) : '01:00';
  }

  // progress bar
  const pct = phaseTotal > 0 ? Math.round((1 - remaining/phaseTotal)*100) : 0;
  fill.style.width = pct + '%';

  // current action
  if (action) {
    curName.textContent = action.label;
  } else {
    curName.textContent = isRunning ? '全部完成！' : '尚未開始';
  }

  // side badge (unilateral)
  if (action && action.type === 'unilateral' && isRunning) {
    sideBadge.style.opacity = '1';
    sideBadge.textContent = currentSide === 'L' ? '左側' : '右側';
  } else {
    sideBadge.style.opacity = '0';
  }

  // set pips
  if (action) {
    const total = action.sets;
    pips.innerHTML = Array.from({length: total}, (_,i) => {
      let cls = '';
      if (i < setIdx) cls = 'done';
      else if (i === setIdx) cls = phase === 'REST' ? 'rest-active' : 'active';
      return `<div class="set-pip ${cls}"></div>`;
    }).join('');
    setsText.textContent = `第 ${setIdx+1} / ${action.sets} 組`;
  } else {
    pips.innerHTML = '';
    setsText.textContent = '—';
  }

  renderProgressDots();
}

function updateBtns() {
  const active = isRunning;
  const paused = isPaused;
  document.getElementById('btn-start').disabled = active && !paused;
  document.getElementById('btn-pause').disabled = !active;
  document.getElementById('btn-early').disabled = !active;
  document.getElementById('btn-stop').disabled = !active && !paused;
  document.getElementById('btn-start').children[1].textContent = paused ? '繼續' : '開始';
  document.getElementById('btn-start').children[0].textContent = paused ? '▶' : '▶';
}

function updateElapsed() {
  document.getElementById('elapsed-display').textContent = fmtTime(totalElapsed);
}

function showSummary(complete) {
  document.getElementById('summary-title').textContent = complete ? '🎉 訓練完成！' : '訓練結算';
  document.getElementById('sum-active').textContent = fmtTime(totalActive);
  document.getElementById('sum-rest').textContent = fmtTime(totalRest);
  document.getElementById('sum-sets').textContent = completedSets;
  document.getElementById('sum-actions').textContent = completedActions;
  const log = document.getElementById('summary-log');
  log.innerHTML = sessionLog.length ? sessionLog.map(l=>`<div>${l}</div>`).join('') : '<div>尚無完成紀錄</div>';
  document.getElementById('summary').classList.add('show');
}

// ─── HELPERS ────────────────────────────────────────────
function fmtTime(s) {
  const m = Math.floor(Math.abs(s)/60);
  const sec = Math.abs(s)%60;
  return (m<10?'0'+m:m)+':'+(sec<10?'0'+sec:sec);
}

function fmtSec(s) {
  return s >= 60 ? Math.floor(s/60)+'分'+( s%60 ? (s%60)+'秒' : '') : s+'秒';
}

// ─── INIT ───────────────────────────────────────────────
updateUI();
updateBtns();
</script>
</body>
</html>
